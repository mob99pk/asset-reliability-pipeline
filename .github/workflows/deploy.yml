name: dbt deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two prod deploys at once; queue instead of cancelling a half-built deploy.
concurrency:
  group: dbt-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dbt-deploy:
    name: dbt-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -r requirements.txt

      - name: Write Snowflake private key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > "$RUNNER_TEMP/rsa_key.p8"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$RUNNER_TEMP/rsa_key.p8" >> "$GITHUB_ENV"

      - name: dbt build -> PROD schema
        run: uv run --no-project -- dbt build --target prod

      - name: Generate dbt docs
        run: uv run --no-project -- dbt docs generate --target prod

      - name: Upload docs site
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs-${{ github.sha }}
          path: |
            target/index.html
            target/manifest.json
            target/catalog.json
          retention-days: 30
